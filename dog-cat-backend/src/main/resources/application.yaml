spring:
  config:
    import: optional:application-local.yaml

  datasource:
    url: jdbc:postgresql://dogcat-pg-dogcat-kova.b.aivencloud.com:22051/defaultdb?sslmode=require
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

management:
  endpoints.web.exposure.include: health,info

  endpoint.health.probes.enabled: true

  health.livenessstate.enabled: true

  health.readinessstate.enabled: true

server:
  port: 8080
  shutdown: graceful